name: canary

on:
  schedule:
    - cron: "41 6 * * *"   # once daily; avoid :00 so it doesn't pile up with everyone else's
    # Mondays: the same jobs, WITH the paid secrets (proxy, Scraping Browser,
    # captcha key). On the daily run above those secrets read as empty, so
    # it takes the free no-secret route and bills nothing.
    - cron: "41 6 * * 1"
  workflow_dispatch: {}     # dispatch manually at least once before trusting the badge

jobs:
  # A real run: three public Pages and their three posts each, with a local
  # Playwright Chromium. Public Pages are readable logged out with no key
  # and no proxy, so this job runs UNGATED from the bare GitHub runner and
  # must produce real rows: a skip, a block (exit 3), a fetch failure
  # (exit 5), zero rows or a partial run all end red. If the FACEBOOK_PROXY
  # secret is set it is used (through the environment, never argv); it is
  # not required.
  #
  # `vars.FACEBOOK_CANARY_PAGES` overrides the Pages (space-separated,
  # default "nike bbcnews nytimes").
  canary:
    runs-on: ubuntu-latest
    env:
      CANARY_PAGES: ${{ vars.FACEBOOK_CANARY_PAGES || 'nike bbcnews nytimes' }}
      FACEBOOK_PROXY: ${{ (github.event_name != 'schedule' || github.event.schedule == '41 6 * * 1') && secrets.FACEBOOK_PROXY || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          pip install -r requirements-playwright.txt
          playwright install --with-deps chromium

      - name: Three Pages, three posts each
        run: |
          set +e
          if [ -n "$FACEBOOK_PROXY" ]; then echo "::notice::FACEBOOK_PROXY is set: running through the proxy."; \
          else echo "::notice::No FACEBOOK_PROXY: running direct from the GitHub runner (a datacentre address)."; fi
          printf '%s\n' $CANARY_PAGES > canary_pages.txt
          python3 playwright_scraper.py --urls-file canary_pages.txt --posts 3 \
            --format json --out canary.json --dump-html
          echo "canary_exit=$?" >> "$GITHUB_ENV"

      - name: Require a complete run with full rows
        run: |
          python3 -c "
          import json, os
          code = int(os.environ['canary_exit'])
          print(f'exit {code}')
          if code != 0:
              names = {3: 'blocked', 4: 'zero rows', 5: 'content never obtained', 6: 'partial'}
              what = names.get(code, 'crash or bad usage')
              print(f'::error::canary requires exit 0, got {code} ({what})')
              raise SystemExit(1)
          meta = json.load(open('canary.json.meta.json'))
          print(json.dumps(meta, indent=2))
          n = len(os.environ['CANARY_PAGES'].split())
          assert meta['status'] == 'complete' and [p['result'] for p in meta['pages']] == ['ok'] * n, meta
          rows = json.load(open('canary.json'))
          pages = [r for r in rows if r['category'] == 'page']
          posts = [r for r in rows if r['category'] == 'post']
          # Parser floor: every Page row, and at least the post each Page
          # EMBEDS. Posts 2 and 3 arrive in a separate timeline request; on
          # 2026-10-15 a GitHub runner got 1 of 3 on all three Pages while
          # the Pages themselves were served, so a shortfall there is a
          # warning about the site's answer to this address, not a parser
          # failure.
          assert len(pages) == n, (len(pages), n)
          without = [p['page_id'] for p in pages if not any(r['page_id'] == p['page_id'] for r in posts)]
          assert not without, ('no post read for these Pages: the embedded post was not parsed', without)
          if len(posts) < 3 * n:
              print(f'::warning::{len(posts)} of {3 * n} posts: the timeline request did not deliver posts 2 and 3 for every Page')
          for p in pages:
              # Only the embedded header fills these; a regression to the
              # login dialog's own text shows up here first.
              assert p['sku'] == 'facebook-page-' + p['page_id'] and p['page_id'].isdigit(), p
              assert p['title'] and p['page_category'] and p['followers'] and p['followers'] > 1000, p
              assert p['is_verified'] is not None and p['website'], p
          for r in posts:
              assert r['post_id'].isdigit() and r['posted_at'] and r['product_url'], r
              assert r['reactions'] is not None and r['comments'] is not None and r['shares'] is not None, r
          print('canary: OK')
          "

      - name: Upload artifacts on every run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-${{ github.run_id }}
          path: |
            canary*.json
            canary_debug_*.html
          retention-days: 14
